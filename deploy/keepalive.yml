# Copy this file to .github/workflows/keepalive.yml (the push token used by the assistant has no `workflow` scope, so it could not create it there).
name: keepalive

# Calls GET /health/db (runs `select 1`) every 3 days.
# This lowers the chance that a free Supabase project is paused for inactivity.
# It is NOT a guarantee: the provider's pause policy can change.
# Setup: add a repository variable API_URL, e.g. https://your-api.example.com (no trailing slash).
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /health/db
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL variable is not set"; exit 1; fi
          curl --fail --silent --show-error --max-time 60 "$API_URL/health/db"
